services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kurvot_user -d kurvot_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  agent:
    build: ./telegram_agent
    container_name: agent
    image: agent:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_net
    env_file:
      - agent.env
    depends_on:
      - server
    develop:
      watch:
        - action: rebuild
          path: ./telegram_agent

  server:
    build: ./server
    container_name: server
    image: server:latest
    restart: unless-stopped
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    develop:
      watch:
        - action: rebuild
          path: ./server
    ports:
      - "8080:8080"
    env_file:
      - server.env
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    networks:
      - app_net
    depends_on:
      db:
        condition: service_healthy


volumes:
  db_data:

networks:
  app_net: